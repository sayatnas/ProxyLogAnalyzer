services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_USER: ${DEMO_USER:-analyst}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-analyst}
    ports:
      - "5000:5000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
